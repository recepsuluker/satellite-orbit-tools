# docker compose up -d
#   Mission Control  -> http://localhost:8000
#   REST API + docs  -> http://localhost:8001/docs
#   Analytics (Streamlit) -> http://localhost:8501
# Optional secrets (Space-Track credentials etc.) go in .env (see .env.example).

x-app: &app
  build: .
  image: satellite-orbit-tools:latest
  env_file:
    - path: .env
      required: false
  environment:
    REDIS_HOST: redis
  volumes:
    - satorbit_data:/data
  restart: unless-stopped

services:
  mission-control:
    <<: *app
    ports:
      - "8000:8000"

  api:
    <<: *app
    command: ["satorbit", "api"]
    environment:
      REDIS_HOST: redis
      API_PORT: "8001"
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy

  dashboard:
    <<: *app
    command: ["satorbit", "dashboard"]
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  satorbit_data:
  redis_data:
